[package]
name = "float"
version = "0.1.0"
description = "Float — a hidden-by-default Windows notch utility"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "float_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Decode SMTC album art (PNG/JPEG verbatim, other formats re-encoded) and
# re-encode a 256 px JPEG; gif/bmp/webp are needed to sniff-and-normalise art.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Phase 4A: native Windows toast when the timer finishes (the notch is hidden).
tauri-plugin-notification = "2"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Security",
  # Phase 2 hot zone: cursor poll, monitor/DPI lookup, mouse buttons.
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # Phase 3A: SMTC now-playing + album art.
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_System_WinRT",
  # Phase 3D-4: GetSystemPowerStatus for AC/battery compact activity.
  "Win32_System_Power",
  # Phase 4A: MessageBeep for the timer-done alert.
  "Win32_System_Diagnostics_Debug",
] }
trash = "5.4.0"
